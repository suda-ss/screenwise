services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: resume_screening
      POSTGRES_USER: resume
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resume}
    volumes:
      - resume-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resume -d resume_screening"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5434:5432"

  api:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - resume-files:/app/storage
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - api
    ports:
      - "127.0.0.1:3008:3000"

volumes:
  resume-db:
  resume-files:

